[project]
name = "petlibro-relay"
version = "0.1.0"
description = "Local MQTT relay bridging a PETLIBRO PLAF203 feeder and the PETLIBRO cloud broker"
readme = "README.md"
authors = [
    { name = "aerodomigue", email = "43935382+aerodomigue@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "paho-mqtt>=2.1.0",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
]
