services:
  # One-shot: renders mosquitto.conf from env vars using our own code
  # (petlibro_relay.mosquitto_config) and writes it to a volume mosquitto
  # mounts read-only. The mosquitto image itself is never modified.
  mosquitto-config:
    build: .
    command: ["python", "-m", "petlibro_relay.mosquitto_config"]
    env_file:
      - .env
    volumes:
      - mosquitto-config:/mosquitto-config

  # Internal only - not published to the host. The feeder never talks to
  # this directly; it connects to the "relay" container's credential
  # capture proxy below, which forwards to this broker byte-for-byte.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: petlibro-relay-mosquitto
    restart: unless-stopped
    depends_on:
      mosquitto-config:
        condition: service_completed_successfully
    volumes:
      - mosquitto-config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  # The PLAF203 camera answers TUTK discovery from a dynamic UDP source port,
  # so this bridge must share the VM network namespace. It serves the verified
  # H.264 stream only on the host-local RTSP endpoint :8554.
  camera-bridge:
    build:
      context: ./camera-bridge
    container_name: petlibro-relay-camera-bridge
    restart: unless-stopped
    network_mode: host
    environment:
      CAMERA_BRIDGE_LISTEN_ADDR: "${CAMERA_BRIDGE_LISTEN_ADDR:-:8081}"
      PETLIBRO_CAMERA_DISCOVERY_BROADCAST_FALLBACK: ${PETLIBRO_CAMERA_DISCOVERY_BROADCAST_FALLBACK:-true}
      PETLIBRO_CAMERA_IDLE_TIMEOUT_SECONDS: ${PETLIBRO_CAMERA_IDLE_TIMEOUT_SECONDS:-10}
      PETLIBRO_CAMERA_MEDIA_RTSP_LISTEN_ADDR: "${PETLIBRO_CAMERA_MEDIA_RTSP_LISTEN_ADDR:-:8554}"

  # Official go2rtc consumes the bridge's local RTSP source and exposes WebRTC.
  # Host networking gives browser ICE candidates the VM's reachable LAN address.
  go2rtc:
    image: alexxit/go2rtc:1.9.14
    container_name: petlibro-relay-go2rtc
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro

  relay:
    build: .
    container_name: petlibro-relay
    restart: unless-stopped
    depends_on:
      - mosquitto
      - camera-bridge
      - go2rtc
    env_file:
      - .env
    environment:
      # Both camera sidecars use the VM host network; keep every endpoint
      # configurable through the relay container environment.
      PETLIBRO_CAMERA_BRIDGE_URL: ${PETLIBRO_CAMERA_BRIDGE_URL:-http://host.docker.internal:8081}
      PETLIBRO_GO2RTC_HOST: ${PETLIBRO_GO2RTC_HOST:-host.docker.internal}
      PETLIBRO_GO2RTC_SOURCE_HOST: ${PETLIBRO_GO2RTC_SOURCE_HOST:-127.0.0.1}
    # The DNS override that points the feeder at this relay rewrites
    # mqtt.us.petlibro.com to this host - and this container has to resolve
    # that same name to reach the REAL cloud. Resolving it through the LAN
    # resolver would point the relay at its own local broker, so it would
    # bridge mosquitto to itself and never reach PETLIBRO at all. Pin public
    # resolvers here so the upstream lookup bypasses the rewrite.
    dns:
      - ${PETLIBRO_UPSTREAM_DNS_PRIMARY:-1.1.1.1}
      - ${PETLIBRO_UPSTREAM_DNS_SECONDARY:-9.9.9.9}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PETLIBRO_HOST_PORT:-1883}:${PETLIBRO_CAPTURE_PROXY_PORT:-1883}"
      # LAN dashboard. It is disabled by default inside the relay; set
      # PETLIBRO_WEB_ENABLED=true before this listener serves HTTP.
      - "${PETLIBRO_WEB_HOST_PORT:-8080}:${PETLIBRO_WEB_PORT:-8080}"
    volumes:
      - relay-data:/data

volumes:
  mosquitto-config:
  mosquitto-data:
  mosquitto-log:
  relay-data:
