# PLAF203 H.264 is supplied by the local camera bridge as a deterministic,
# device-scoped RTSP source. Streams are registered dynamically by the relay
# and rebuilt after a go2rtc restart; source URLs never leave the local stack.

api:
  listen: ":1984"

# camera-bridge owns host port 8554. go2rtc needs its RTSP module enabled to
# let FFmpeg pull that source, so its own server is bound to a separate local
# loopback-only port rather than disabling the module entirely.
rtsp:
  listen: "127.0.0.1:8556"

webrtc:
  listen: ":8555"

streams: {}
